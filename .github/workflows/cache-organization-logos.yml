name: Cache organization logos

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/cache-organization-logos.yml'

permissions:
  contents: write

jobs:
  cache-logos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download organization logos
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/img/organizations
          UA='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/128 Safari/537.36'

          fetch() {
            url="$1"
            out="$2"
            curl -L --fail --retry 3 --retry-delay 2 -A "$UA" "$url" -o "$out"
            test -s "$out"
          }

          fetch 'https://www.dadgroup.com/wp-content/uploads/2023/11/uplift-dad-website-05.png' 'assets/img/organizations/dar-al-dawaa.png'
          fetch 'https://thumb.wikimedia.org/wikipedia/commons/thumb/c/c8/Orange_logo.svg/960px-Orange_logo.svg.png' 'assets/img/organizations/orange.png'
          fetch 'https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTyDzdQaioHKj_9wwr-ZOfnb4yQSX_D4PcxeXDVUE1F2w5U4NJkEkID9hs&s=10' 'assets/img/organizations/coderz.png'
          fetch 'https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcR3kQLjECN61uN-AZwJnJa49XUWS3b8JPOpgrzrpYrpKfhl84U1nOoYkzs&s=10' 'assets/img/organizations/unrwa.png'
          fetch 'https://opensooqui2.os-cdn.com/os_web/fbApp/opensooq_fb_square.png' 'assets/img/organizations/opensooq.png'
          fetch 'https://upload.wikimedia.org/wikipedia/commons/e/e3/STC-01.svg' 'assets/img/organizations/stc.svg'

          file assets/img/organizations/*

      - name: Commit cached logos
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/img/organizations
          if git diff --cached --quiet; then
            echo 'No logo changes to commit.'
            exit 0
          fi
          git commit -m 'Add local organization logo assets'
          git push
