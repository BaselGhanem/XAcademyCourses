name: Course224 — Chromium Learner Browser Smoke
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/course224-browser-smoke.yml'
      - 'PowerBi/Course224/tools/smoke_site.py'
      - 'PowerBi/Course224/data.js'
      - 'PowerBi/Course224/day.html'
      - 'PowerBi/Course224/videos.js'
      - 'PowerBi/Course224/dashboard.html'
      - 'PowerBi/Course224/login.html'
      - 'PowerBi/Course224/week3/day10/student-missions.html'
      - 'PowerBi/Course224/week3/day10/ai-visual-design-lab.html'
      - 'PowerBi/Course224/concepts/index.html'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  chromium-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Playwright and Chromium browser dependencies
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Test real learner journey in Chromium
        run: python PowerBi/Course224/tools/smoke_site.py
