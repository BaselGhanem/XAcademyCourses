<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Course Hub | Power BI Specialist</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="shell topbar-inner">
      <a class="brand" href="dashboard.html">
        <span class="pbi-mark"><span></span><span></span><span></span></span>
        <span class="brand-copy"><strong>Power BI Course Hub</strong><small>10 DAYS • 20 HOURS</small></span>
      </a>
      <div class="nav-actions">
        <a class="btn btn-ghost" href="concepts/">Concept Cards</a>
        <a class="btn btn-ghost" href="index.html">الموقع الرئيسي</a>
        <button class="icon-btn" id="logoutBtn" title="تسجيل الخروج">↪</button>
      </div>
    </div>
  </header>

  <main>
    <section class="portal-hero">
      <div class="shell portal-top">
        <div class="welcome-card">
          <span class="eyebrow">YOUR COURSE HUB</span>
          <h1>أهلاً، <span id="studentName"></span>.</h1>
          <p>تابع مسارك التعليمي وحمّل الملفات ونفّذ التمارين بحسب تقدمك.</p>
          <p class="learner-interest" id="learnerInterest"></p>
          <div class="progress-line"><i id="progressFill" style="width:0%"></i></div>
          <div class="progress-meta"><span id="progressText">0 من 10 أيام مكتملة</span><span id="progressPct">0%</span></div>
        </div>
        <aside class="next-card" id="nextCard"></aside>
      </div>
    </section>

    <section class="portal-section">
      <div class="shell">
        <div class="portal-head">
          <div><h2>الأيام العشرة</h2><p>اختر اليوم لمشاهدة التسجيلات والملفات والتمارين.</p></div>
          <div class="filter-row">
            <button class="filter-btn active" data-filter="all">الكل</button>
            <button class="filter-btn" data-filter="available">متاحة</button>
            <button class="filter-btn" data-filter="locked">غير متاحة</button>
            <button class="filter-btn" data-filter="completed">مكتملة عندي</button>
          </div>
        </div>
        <div class="portal-grid" id="daysGrid"></div>
      </div>
    </section>
  </main>

  <script src="data.js"></script>
  <script src="progress.js"></script>
  <script src="videos.js"></script>
  <script src="access.js"></script>
  <script>
    const learnerProfile = CourseProgress.getProfile();
    const student = learnerProfile?.name;
    if (!student) location.href = 'login.html';
    document.getElementById('studentName').textContent = student || '';
    document.getElementById('learnerInterest').textContent = `مجال اهتمامك: ${CourseProgress.domainLabel(learnerProfile?.domain)}`;

    function getCompleted() { return CourseProgress.getCompleted(); }

    function renderProgress() {
      const done = getCompleted();
      const pct = Math.round((done.length / DAYS.length) * 100);
      document.getElementById('progressFill').style.width = `${pct}%`;
      document.getElementById('progressText').textContent = `${done.length} من ${DAYS.length} أيام مكتملة`;
      document.getElementById('progressPct').textContent = `${pct}%`;
    }

    function getNextRelevantDay() {
      const open = DAYS.filter(day => isDayOpen(day.id));
      const done = getCompleted();
      return open.find(day => !done.includes(day.id)) || open[open.length - 1] || DAYS[0];
    }

    function renderNextCard() {
      const day = getNextRelevantDay();
      const status = COURSE_CONFIG.deliveryMode === 'self-paced' ? 'available' : dayRuntimeStatus(day);
      const open = isDayOpen(day.id);
      const liveButton = COURSE_CONFIG.liveUrl
        ? `<a class="btn btn-primary" href="${COURSE_CONFIG.liveUrl}" target="_blank" rel="noopener">دخول الجلسة المباشرة</a>`
        : '';
      document.getElementById('nextCard').innerHTML = `
        <span class="next-label">${COURSE_CONFIG.deliveryMode === 'self-paced' ? 'YOUR NEXT LESSON' : (status === 'today' ? 'TODAY' : 'NEXT AVAILABLE DAY')}</span>
        <h2>Day ${String(day.id).padStart(2,'0')} - ${day.titleAr}</h2>
        <p>${day.hook}</p>
        <span class="next-date">${COURSE_CONFIG.deliveryMode === 'self-paced' ? '120 دقيقة · تعلّم مرن' : `${day.weekday} • ${formatDateAr(day.date)}`}</span>
        <div class="live-slot">
          ${open ? `<a class="btn btn-ghost" href="day.html?id=${day.id}">عرض تفاصيل اليوم</a>` : ''}
          ${liveButton}
        </div>`;
    }

    function renderDays(filter='all') {
      const done = getCompleted();
      const grid = document.getElementById('daysGrid');
      grid.innerHTML = '';
      DAYS.forEach(day => {
        const runtime = COURSE_CONFIG.deliveryMode === 'self-paced' ? 'available' : dayRuntimeStatus(day);
        const isCompleted = done.includes(day.id);
        if (filter === 'completed' && !isCompleted) return;
        const open = isDayOpen(day.id);
        if (filter === 'available' && !open) return;
        if (filter === 'locked' && open) return;
        if (!['all','available','locked','completed'].includes(filter) && runtime !== filter) return;
        const card = document.createElement(open ? 'a' : 'article');
        if (open) {
          card.href = `day.html?id=${day.id}`;
          card.setAttribute('aria-label', `افتح Day ${day.id}: ${day.titleAr}`);
        }
        card.className = `portal-day ${isCompleted ? 'completed' : ''} ${open ? 'open' : 'locked'}`;
        card.setAttribute('aria-disabled', open ? 'false' : 'true');
        card.innerHTML = `
          <div class="portal-day-top">
            <div class="portal-day-index">${String(day.id).padStart(2,'0')}</div>
            <div>
              <h3>${day.titleAr}</h3>
              <span class="portal-en" dir="ltr">${day.title}</span>
            </div>
            ${open ? '' : '<span class="day-lock-badge" aria-label="مقفل">LOCKED</span>'}
          </div>
          <div class="portal-day-bottom">
            <span class="status-chip ${open ? runtime : 'locked'}"><i class="complete-dot"></i>${open ? (isCompleted ? 'مكتمل' : (COURSE_CONFIG.deliveryMode === 'self-paced' ? 'متاح للتعلم' : (runtime === 'today' ? 'اليوم' : runtime === 'past' ? 'تم موعده' : day.weekday + ' • ' + formatDateAr(day.date)))) : 'غير متاح حالياً'}</span>
            <span class="resource-count">${open ? (COURSE_CONFIG.showLegacyRecordings && hasDayVideo(day.id) ? '▶ التسجيل متاح للمشاهدة' : day.resources.length + ' مواد متاحة لليوم') : 'لم ينشر هذا الدرس بعد'}</span>
          </div>`;
        grid.appendChild(card);
      });
    }

    document.querySelectorAll('.filter-btn').forEach(btn => btn.addEventListener('click', () => {
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderDays(btn.dataset.filter);
    }));

    document.getElementById('logoutBtn').addEventListener('click', () => {
      CourseProgress.logout();
      location.href = 'login.html';
    });

    renderProgress(); renderNextCard(); renderDays();
  </script>
</body>
</html>
