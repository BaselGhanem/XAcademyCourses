<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<rect width="1600" height="900" fill="#0b1116"/><rect x="60" y="55" width="1480" height="790" rx="36" fill="#121a21" stroke="#27343d"/>
<text x="110" y="125" fill="#6aa8ff" font-size="28" font-family="Arial" font-weight="700">DAY 6 • FILTER CONTEXT</text>
<text x="110" y="185" fill="#fff" font-size="58" font-family="Arial" font-weight="800">Same Measure • Different Context • Different Result</text>
<text x="110" y="230" fill="#9eb0bc" font-size="27" font-family="Arial">[Total Revenue] does not change — the filters around it do.</text>
<rect x="120" y="310" width="320" height="240" rx="26" fill="#171f25" stroke="#42535e"/><text x="280" y="370" text-anchor="middle" fill="#9eb0bc" font-size="23" font-family="Arial">ALL DATA</text><text x="280" y="445" text-anchor="middle" fill="#fff" font-size="44" font-family="Arial" font-weight="800">[Total Revenue]</text><text x="280" y="510" text-anchor="middle" fill="#6aa8ff" font-size="28" font-family="Arial">Base context</text>
<rect x="480" y="310" width="320" height="240" rx="26" fill="#0d292b" stroke="#099999"/><text x="640" y="370" text-anchor="middle" fill="#6edbd7" font-size="23" font-family="Arial">REGION = AMMAN</text><text x="640" y="445" text-anchor="middle" fill="#fff" font-size="44" font-family="Arial" font-weight="800">[Total Revenue]</text><text x="640" y="510" text-anchor="middle" fill="#6edbd7" font-size="28" font-family="Arial">Region filter</text>
<rect x="840" y="310" width="320" height="240" rx="26" fill="#211f12" stroke="#f2c811"/><text x="1000" y="370" text-anchor="middle" fill="#f2c811" font-size="23" font-family="Arial">MONTH = MARCH</text><text x="1000" y="445" text-anchor="middle" fill="#fff" font-size="44" font-family="Arial" font-weight="800">[Total Revenue]</text><text x="1000" y="510" text-anchor="middle" fill="#f2c811" font-size="28" font-family="Arial">Time filter</text>
<rect x="1200" y="310" width="280" height="240" rx="26" fill="#271a2c" stroke="#a98bff"/><text x="1340" y="370" text-anchor="middle" fill="#c9b7ff" font-size="23" font-family="Arial">CATEGORY CLICK</text><text x="1340" y="445" text-anchor="middle" fill="#fff" font-size="42" font-family="Arial" font-weight="800">[Total Revenue]</text><text x="1340" y="510" text-anchor="middle" fill="#c9b7ff" font-size="28" font-family="Arial">Visual filter</text>
<rect x="260" y="640" width="1080" height="105" rx="26" fill="#10181e" stroke="#34434d"/><text x="800" y="705" text-anchor="middle" fill="#fff" font-size="36" font-family="Arial" font-weight="800">MEASURE + CURRENT FILTERS = RESULT</text>
<text x="800" y="805" text-anchor="middle" fill="#9eb0bc" font-size="27" font-family="Arial">Before debugging DAX, ask: What is filtering this visual?</text>
</svg>