<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<rect width="1600" height="900" fill="#0b1116"/><rect x="60" y="55" width="1480" height="790" rx="36" fill="#121a21" stroke="#27343d"/>
<text x="110" y="125" fill="#f2c811" font-size="28" font-family="Arial" font-weight="700">DAY 4 • MODELING</text>
<text x="110" y="185" fill="#ffffff" font-size="58" font-family="Arial" font-weight="800">Fact Table vs Dimension Table</text>
<text x="110" y="230" fill="#9eb0bc" font-size="28" font-family="Arial">Fact = What happened • Dimension = Describe what happened</text>
<rect x="110" y="300" width="620" height="430" rx="28" fill="#211f12" stroke="#f2c811" stroke-width="3"/>
<text x="150" y="365" fill="#f2c811" font-size="38" font-family="Arial" font-weight="800">FactSales</text>
<text x="150" y="415" fill="#ffffff" font-size="26" font-family="Arial">One row = one Transaction</text>
<g fill="#d9e1e5" font-size="25" font-family="Arial"><text x="165" y="480">Transaction ID</text><text x="165" y="525">Product ID</text><text x="165" y="570">Customer ID</text><text x="165" y="615">Branch ID</text><text x="165" y="660">Quantity • Revenue • Discount</text></g>
<rect x="870" y="300" width="620" height="430" rx="28" fill="#0d292b" stroke="#099999" stroke-width="3"/>
<text x="910" y="365" fill="#63d3cf" font-size="38" font-family="Arial" font-weight="800">Dimensions</text>
<text x="910" y="415" fill="#ffffff" font-size="26" font-family="Arial">One row = one entity</text>
<g fill="#d9e1e5" font-size="25" font-family="Arial"><text x="925" y="480">DimProduct → Product, Category, Brand</text><text x="925" y="525">DimCustomer → Customer, Segment</text><text x="925" y="570">DimBranch → Branch, Region, Channel</text><text x="925" y="615">DimDate → Date, Month, Quarter</text></g>
<path d="M755 515 L835 515" stroke="#9eb0bc" stroke-width="6"/><path d="M835 515 l-20 -14 v28 z" fill="#9eb0bc"/>
<text x="800" y="790" text-anchor="middle" fill="#ffffff" font-size="34" font-family="Arial" font-weight="700">اسأل: هذا الجدول يسجل حدثا؟ أم يصف الحدث؟</text>
</svg>