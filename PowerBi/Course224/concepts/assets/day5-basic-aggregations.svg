<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<rect width="1600" height="900" fill="#0b1116"/><rect x="60" y="55" width="1480" height="790" rx="36" fill="#121a21" stroke="#27343d"/>
<text x="110" y="125" fill="#f2c811" font-size="28" font-family="Arial" font-weight="700">DAY 5 • BASIC DAX</text>
<text x="110" y="185" fill="#fff" font-size="58" font-family="Arial" font-weight="800">Three Questions • Three Aggregations</text>
<text x="110" y="230" fill="#9eb0bc" font-size="27" font-family="Arial">What value? • How many events? • How many unique entities?</text>
<rect x="610" y="300" width="380" height="150" rx="26" fill="#211f12" stroke="#f2c811" stroke-width="3"/><text x="800" y="360" text-anchor="middle" fill="#f2c811" font-size="38" font-family="Arial" font-weight="800">FactSales</text><text x="800" y="405" text-anchor="middle" fill="#fff" font-size="23" font-family="Arial">Thousands of transaction rows</text>
<path d="M690 450 L400 565" stroke="#71838d" stroke-width="5"/><path d="M800 450 L800 565" stroke="#71838d" stroke-width="5"/><path d="M910 450 L1200 565" stroke="#71838d" stroke-width="5"/>
<rect x="160" y="565" width="430" height="180" rx="24" fill="#0d292b" stroke="#099999" stroke-width="3"/><text x="375" y="620" text-anchor="middle" fill="#6edbd7" font-size="31" font-family="Arial" font-weight="800">SUM(Revenue)</text><text x="375" y="670" text-anchor="middle" fill="#fff" font-size="27" font-family="Arial">Total Revenue</text><text x="375" y="710" text-anchor="middle" fill="#9eb0bc" font-size="21" font-family="Arial">How much value?</text>
<rect x="585" y="565" width="430" height="180" rx="24" fill="#171f25" stroke="#52636e" stroke-width="3"/><text x="800" y="620" text-anchor="middle" fill="#fff" font-size="31" font-family="Arial" font-weight="800">COUNTROWS()</text><text x="800" y="670" text-anchor="middle" fill="#fff" font-size="27" font-family="Arial">Transactions</text><text x="800" y="710" text-anchor="middle" fill="#9eb0bc" font-size="21" font-family="Arial">How many events?</text>
<rect x="1010" y="565" width="430" height="180" rx="24" fill="#211f12" stroke="#f2c811" stroke-width="3"/><text x="1225" y="620" text-anchor="middle" fill="#f2c811" font-size="28" font-family="Arial" font-weight="800">DISTINCTCOUNT(Customer ID)</text><text x="1225" y="670" text-anchor="middle" fill="#fff" font-size="27" font-family="Arial">Customers</text><text x="1225" y="710" text-anchor="middle" fill="#9eb0bc" font-size="21" font-family="Arial">How many unique entities?</text>
<text x="800" y="810" text-anchor="middle" fill="#fff" font-size="32" font-family="Arial" font-weight="800">40,000 rows ≠ 40,000 customers</text>
</svg>