const TASKS=[{"time":"00–20","phase":"تطبيق","title":"بيانات المبيعات","say":"اليوم انتقلنا الى بيانات المبيعات حتى نطبق مهاراتنا على سيناريو مختلف","screen":"افتح ملف Nova Sales في Power BI","practice":"مراجعة الحقول والبيانات المستوردة","check":"تم التطبيق على بيانات المبيعات"},{"time":"20–40","phase":"تطبيق","title":"صفحة جديدة","say":"خصصنا صفحة جديدة للمبيعات بدلا من خلطها مع صفحات تقييم الاداء","screen":"Report view > New page","practice":"عرض بيانات المبيعات في صفحة جديدة","check":"الصفحة الجديدة موجودة"},{"time":"40–70","phase":"تطبيق","title":"Field Parameters","say":"تعلمنا كيف نخلي المستخدم يغير منظور الرسم باختيار الحقل","screen":"Modeling > New parameter > Fields","practice":"تبديل الحقول في التقرير","check":"تم انشاء Parameter وتجربته"},{"time":"70–90","phase":"تطبيق","title":"Tooltip","say":"تعلمنا Tooltip، وبنرجع نراجعها باليوم الثامن","screen":"اعرض Tooltip على صفحة التقرير","practice":"مراجعة التفاعل","check":"مراجعة Tooltip مؤجلة لليوم الثامن"},{"time":"90–120","phase":"تطبيق","title":"Layout Studio","say":"عملنا تصميم Layout باستخدام موقع التصميم","screen":"افتح https://baselghanem.github.io/pb/","practice":"انشاء Layout للصفحة الجديدة","check":"تصميم Layout تم تعلمه"}];
(function(){const prefix='course223-trainer-day7-actual-v1';let idx=0,done=[],notes={};try{idx=Number(localStorage.getItem(prefix+'-idx')||0);done=JSON.parse(localStorage.getItem(prefix+'-done')||'[]');notes=JSON.parse(localStorage.getItem(prefix+'-notes')||'{}')}catch(e){}if(idx<0||idx>=TASKS.length)idx=0;const $=id=>document.getElementById(id);const menu=$('menu');function save(){try{localStorage.setItem(prefix+'-idx',String(idx));localStorage.setItem(prefix+'-done',JSON.stringify(done));localStorage.setItem(prefix+'-notes',JSON.stringify(notes))}catch(e){}}function render(){const item=TASKS[idx];$('session').textContent=item.time;$('phase').textContent=item.phase;$('title').textContent=item.title;$('say').textContent=item.say;$('screen').textContent=item.screen;$('practice').textContent=item.practice;$('check').textContent=item.check;$('note').value=notes[idx]||'';$('complete').textContent=done[idx]?'✓ تم الإنجاز':'✓ انجزت المهمة';$('prev').disabled=idx===0;$('next').disabled=idx===TASKS.length-1;menu.innerHTML='';TASKS.forEach((t,i)=>{const b=document.createElement('button');b.type='button';b.className='tab'+(idx===i?' on':'')+(done[i]?' done':'');const n=document.createElement('span');n.textContent=String(i+1).padStart(2,'0');b.appendChild(n);b.append(document.createTextNode(t.title));b.onclick=()=>{idx=i;render()};menu.appendChild(b)});const n=done.filter(Boolean).length;$('progressLabel').textContent=String(n).padStart(2,'0')+' / '+String(TASKS.length).padStart(2,'0');$('bar').style.width=(n/TASKS.length*100)+'%';save();}function go(delta){idx=Math.max(0,Math.min(TASKS.length-1,idx+delta));render()}$('complete').onclick=()=>{done[idx]=!done[idx];if(done[idx]&&idx<TASKS.length-1){idx++}render()};$('prev').onclick=()=>go(-1);$('next').onclick=()=>go(1);$('note').addEventListener('input',e=>{notes[idx]=e.target.value;save()});const reduced=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;let off=reduced;const motion=$('motion');function apply(){document.body.classList.toggle('reduced',off);motion.textContent=off?'تشغيل الحركة':'ايقاف الحركة'}motion.onclick=()=>{off=!off;apply()};apply();document.addEventListener('keydown',e=>{if(e.target.tagName==='TEXTAREA')return;if(e.key==='ArrowLeft')go(1);if(e.key==='ArrowRight')go(-1)});render()})();
</script></body></html>
