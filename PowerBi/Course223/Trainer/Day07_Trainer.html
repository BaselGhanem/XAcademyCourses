const TASKS=[{"time":"00–10","phase":"شرح","title":"ليش ظهر BLANK؟","say":"مريم، احنا ما بدنا Card فاضية. بس لازم نعرف شو السؤال: متوسط كل الموظفين ولا نتيجة موظف واحد؟","screen":"افتح Executive Performance من نسخة Day06؛ ورجي الفرق بين Manager KPI Average وManager Employee Weighted (Complete).","practice":"اختاري موظفا وQuarter واحدا وشوفي متى بتظهر النتيجة.","check":"افصلي بين Blank حقيقي بسبب نقص KPI وبين Card بغير سياقها."},{"time":"10–25","phase":"شرح","title":"Quarter-over-Quarter + Year-over-Year","say":"نفس مؤشر الاداء، مرة بنقارنه بالربع اللي قبله، ومرة بنفس الربع من السنة اللي راحت.","screen":"اعرض Q2 2026 مقارنة Q1 2026، ثم Q2 2026 مقارنة Q2 2025؛ بدون صيغ جديدة.","practice":"خليها تتوقع ما معنى اختلاف كل مقارنة.","check":"Quick Measure يحتاج Date column من Calendar ممتد الى الفترتين."},{"time":"25–33","phase":"شرح","title":"بناء قراءة تنفيذية بسيطة","say":"Card بتجاوب شو الرقم، والـTrend بيجاوب كيف وصلنا له.","screen":"ورجي نموذج 3 Cards + Line/Combo، ومعنى Field Parameters ببساطة.","practice":"اطلبي اختيار الرسم المناسب للمدير.","check":"لا تخلط Manager مع Self او Upward."},{"time":"33–40","phase":"شرح","title":"لمسة التصميم","say":"مش لازم نكون مصممين حتى نطلع صفحة مرتبة.","screen":"اعرض Layout من pb ثم استعرض Scroller مختبر مسبقا.","practice":"خلّيها تختار تخطيطا واحدا.","check":"لا تضيع وقت بمتجر الـVisuals اثناء الدرس."},{"time":"40–52","phase":"تطبيق","title":"Append البيانات ومعالجة الـCards","say":"بخطوة واحدة رح نوسع بياناتنا ونشوف ليش بعض البطاقات بحاجة فلتر محدد.","screen":"Save As من Day06. Get Data CSV واحد -> Transform Data -> Append Queries في جدول EvaluationScores_2026_H1. احتفظي بجميع الاعمدة. استخدمي Manager KPI Average للملخص العام، واحتفظي بالـWeighted Cards للتفاصيل الصحيحة.","practice":"تتحقق من عدم تكرار H1 2026 ومن ظهور 2025 Q1 وQ2 وQ3 وQ4.","check":"لا تستبدل BLANK بتقييم صفر. Manager Employee Weighted لا يصلح لكارد شامل لكل الموظفين."},{"time":"52–65","phase":"تطبيق","title":"Calendar والصحة المنطقية","say":"بدون Calendar صح، المقارنة ممكن تكون شكلها مقنع لكن غلط.","screen":"وسّع Calendar الحالي من 2025-01-01 الى 2026-12-31 وتأكد من Date type وRelationship وQuarterLabel. لا تنشئ Calendar ثانية نشطة.","practice":"اختاري كل Quarter وشوفي بياناته.","check":"Expected: 2025 Q1 5011، Q2 5012، Q3 5011، Q4 5012، و2026 Q3 5011، Q4 5012 من الملف الاضافي. الاصل 2026 H1 يبقى كما هو."},{"time":"65–82","phase":"تطبيق","title":"Quick Measures وقيم قابلة للفحص","say":"ما رح نكتب DAX جديد؛ خلينا نستخدم الادوات الجاهزة ونفهم النتائج.","screen":"New Quick Measure: QoQ change ثم YoY change باستخدام Manager KPI Average وCalendar[Date]، ثم Cards وLine/Combo.","practice":"تختبر 2026 Q2 مقابل Q1، و2026 Q2 مقابل 2025 Q2.","check":"لا تستخدم Manager Weighted للسنة 2025 قبل التحقق من خطة الاوزان. تاكد ان التجميع متوسط وليس SUM."},{"time":"82–92","phase":"تطبيق","title":"Field Parameters","say":"نفس الرسم يجاوب سؤالين: شو وضع المديريات؟ وشو وضع الاقسام؟","screen":"Modeling -> New parameter -> Fields؛ ضع DirectorateName وDepartmentName وأنشئ Slicer.","practice":"بدّل بين البعدين على نفس الرسم.","check":"اختبر أن الـField Parameter لا يغير مقياس النتيجة."},{"time":"92–100","phase":"تطبيق","title":"Premium Layout + Scroller","say":"الفرق بين التقرير العادي والاحترافي هو الوضوح والانضباط بالتفاصيل.","screen":"اختر Layout واحد من pb وضع ثلاث Cards ومخطط، ثم Scroller واحد جاهز.","practice":"اضبط المسافات والخط والتباين.","check":"لو Custom Visual غير متاح، لا توقف الدرس؛ اكتف بالمقارنة الأساسية."},{"time":"100–120","phase":"تمرين","title":"Mini Dashboard — Nova","say":"اليوم بدك تشتغلي لحالك: 3 بطاقات، Trend واحد، وجملة تلخص النتيجة.","screen":"افتح Nova Sales — 24000 صف — جهز Calendar بسيط للمقارنة، ولا تقدم الحل.","practice":"مريم تسلم صفحة مستقلة مع ثلاث بطاقات ورسم واحد وInsight.","check":"تحقق من المقارنة عبر السنوات واختيار منطقة واحدة للاستنتاج."}];
(function(){const prefix='course223-trainer-day7-v3';let idx=0,done=[],notes={};try{idx=Number(localStorage.getItem(prefix+'-idx')||0);done=JSON.parse(localStorage.getItem(prefix+'-done')||'[]');notes=JSON.parse(localStorage.getItem(prefix+'-notes')||'{}')}catch(e){}if(idx<0||idx>=TASKS.length)idx=0;const $=id=>document.getElementById(id);const menu=$('menu');function save(){try{localStorage.setItem(prefix+'-idx',String(idx));localStorage.setItem(prefix+'-done',JSON.stringify(done));localStorage.setItem(prefix+'-notes',JSON.stringify(notes))}catch(e){}}function render(){const item=TASKS[idx];$('session').textContent=item.time;$('phase').textContent=item.phase;$('title').textContent=item.title;$('say').textContent=item.say;$('screen').textContent=item.screen;$('practice').textContent=item.practice;$('check').textContent=item.check;$('note').value=notes[idx]||'';$('complete').textContent=done[idx]?'✓ تم الإنجاز':'✓ انجزت المهمة';$('prev').disabled=idx===0;$('next').disabled=idx===TASKS.length-1;menu.innerHTML='';TASKS.forEach((t,i)=>{const b=document.createElement('button');b.type='button';b.className='tab'+(idx===i?' on':'')+(done[i]?' done':'');const n=document.createElement('span');n.textContent=String(i+1).padStart(2,'0');b.appendChild(n);b.append(document.createTextNode(t.title));b.onclick=()=>{idx=i;render()};menu.appendChild(b)});const n=done.filter(Boolean).length;$('progressLabel').textContent=String(n).padStart(2,'0')+' / 10';$('bar').style.width=(n*10)+'%';save();}function go(delta){idx=Math.max(0,Math.min(TASKS.length-1,idx+delta));render()}$('complete').onclick=()=>{done[idx]=!done[idx];if(done[idx]&&idx<TASKS.length-1){idx++}render()};$('prev').onclick=()=>go(-1);$('next').onclick=()=>go(1);$('note').addEventListener('input',e=>{notes[idx]=e.target.value;save()});const reduced=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;let off=reduced;const motion=$('motion');function apply(){document.body.classList.toggle('reduced',off);motion.textContent=off?'تشغيل الحركة':'ايقاف الحركة'}motion.onclick=()=>{off=!off;apply()};apply();document.addEventListener('keydown',e=>{if(e.target.tagName==='TEXTAREA')return;if(e.key==='ArrowLeft')go(1);if(e.key==='ArrowRight')go(-1)});render()})();
