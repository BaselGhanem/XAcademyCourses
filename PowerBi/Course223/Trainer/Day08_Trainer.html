const TASKS=[{"time":"00–10","phase":"استرجاع","title":"نرجع لصفحة المبيعات","say":"مريم، اليوم ما رح نبدأ من الصفر. عندنا صفحة مبيعات من المحاضرة السابقة، وبدنا نطلع منها جواب واضح على سؤال المدير","screen":"افتحي نسخة Power BI المحفوظة من اليوم السابع. لو البيانات مش موجودة، استخدمي Nova_Sales_2025_2026.xlsx من صفحة مريم. تاكدي من Product وCategory وQuantity وTarget وحقل التاريخ، ولا تستوردي نفس البيانات مرتين","practice":"خليها تختار منتجا وفئة وتتأكد ان البيانات تظهر بصفحة المبيعات","check":"الحقول والأنواع سليمة، والتاريخ Date، والملف محفوظ بنسخة جديدة بدون استبدال ملف اليوم السابع"},{"time":"10–25","phase":"مراجعة","title":"Report Page Tooltip","say":"المدير لما يحط الماوس على صنف، لازم يعرف تفاصيله من غير ما نزيد عشر رسومات في الصفحة","screen":"New page > Canvas settings > Tooltip، Page information > Tooltip ON. حطي Sum Quantity وSum Target. من Format visual > General > Tooltips اختاري Report page وحددي Product Tooltip","practice":"مرري المؤشر على صنفين مختلفين وخلي مريم تقارن الارقام. اخفي صفحة Tooltip من قائمة الصفحات","check":"الـ Tooltip بتتغير حسب الصنف، والصفحة غير تفاعلية لذلك لا تضعي Slicer او زر بداخلها"},{"time":"25–45","phase":"تطبيق","title":"Matrix + Conditional Formatting","say":"خلينا نترك قصة الجدول العادي. بدي اول نظرة تورجيني وين حجم المبيعات الاكبر، بس الرقم يضل مفهوم","screen":"Visualizations > Matrix. Rows: Category ثم Product. Values: Sum of Quantity وSum of Target. فعلي Data bars على Sum of Quantity من Conditional formatting","practice":"خلي مريم توسع فئة محددة وتشوف المنتجات وتغير ترتيب العمود","check":"لا تضاعف في الاجمالي، ولا تحول Qty او Target الى نسبة مئوية، واحرصي على تباين جيد"},{"time":"45–60","phase":"تطبيق","title":"Top N — افضل خمسة","say":"لما المدير يسأل مين اكثر خمسة منتجات انباعت بالوحدات، ما بدي جواب انشائي. بدنا ترتيب بالدليل","screen":"Clustered bar chart: Product على Y-axis وSum Quantity على X-axis. Filters on this visual > Product > Top N > Top 5، وBy value: Sum of Quantity ثم Apply filter","practice":"خلي مريم تجرب فلتر Category وتشوف اذا تغير Top 5","check":"الترتيب تنازلي حسب Sum Quantity، مش حسب الاسم ولا Target"},{"time":"60–95","phase":"تطبيق","title":"Quick Measures — YoY ثم QoQ","say":"نفس الرقم ممكن يكون ممتاز او ضعيف حسب المقارنة. اليوم رح نخلي Power BI يكتب الصيغة، واحنا بدنا نفهمها ونتحقق منها","screen":"تحققي اولا ان تاريخ المبيعات Date ويغطي فترة المقارنة. اذا كان Calendar مخصص، تأكدي من علاقته النشطة مع مبيعات Nova ومن Mark as date table. اختاري New quick measure > Time intelligence > Year-over-year change. Base value = Sum of Quantity، Date = حقل تاريخ سليم. كرري Quarter-over-quarter change اذا ظهرت فترات متتالية","practice":"اسأليها: شو الفرق بين مقارنة الربع الثاني مع نفس الربع السنة الماضية، ومقارنته بالربع اللي قبله؟ ثم جربي فلتر Category","check":"فترات المقارنة موجودة وضمن نفس الفلتر. الناتج ليس Revenue، ولو ظهر BLANK بسبب غياب فترة سابقة لا نستبدله بصفر. اذا ما زبطت المقارنة لا تضلي عالقة: راجعي التاريخ قبل اي DAX"},{"time":"95–110","phase":"تجربة جديدة","title":"Scroller — فقط اذا متاح","say":"آخر اضافة اليوم لمسة حركة، بس التقرير المفيد ما بيعتمد عليها. خلينا نجرب بدون ما تشغلنا عن التحليل","screen":"Visualizations > Get more visuals، ابحثي عن Scroller. افحصي الناشر والترخيص والسياسات قبل الاضافة، ثم اختاري حقول قصيرة متوافقة مع الـVisual الموجود","practice":"اختاري سرعة مقروءة ونصا بسيطا، او استبدليها بملخص نصي ثابت اذا لم يتوفر","check":"لا تشتري او تثبتي Visual غير معتمد، ولا تؤخري اختبار التقرير. اذا لم يتوفر Scroller اعتبريها خطوة اطلاع فقط"},{"time":"110–120","phase":"النتيجة","title":"QA ثم Save As","say":"قبل ما نسكر، لو كنت مدير مبيعات وسألتك مين افضل خمسة منتجات وهل تحسنت عن السنة الماضية، بدك تجاوبيني من التقرير نفسه","screen":"اختبري فلاتر Category وProduct، تطابق Matrix وTop N، صحة Tooltip، وصحة مقارنة YoY/QoQ، ثم Save As > Day08_Sales_Analysis.pbix","practice":"مريم تعطينا استنتاجا واحدا من بيانات المبيعات","check":"لا توجد قيم مختلقة، تفاصيل الصنف سليمة، لا تغيير على صفحات الاداء القديمة، وحفظنا نسخة اليوم الثامن"}];
(function(){const prefix='course223-trainer-day8-v1';let idx=0,done=[],notes={};try{idx=Number(localStorage.getItem(prefix+'-idx')||0);done=JSON.parse(localStorage.getItem(prefix+'-done')||'[]');notes=JSON.parse(localStorage.getItem(prefix+'-notes')||'{}')}catch(e){}if(idx<0||idx>=TASKS.length)idx=0;const $=id=>document.getElementById(id);const menu=$('menu');function save(){try{localStorage.setItem(prefix+'-idx',String(idx));localStorage.setItem(prefix+'-done',JSON.stringify(done));localStorage.setItem(prefix+'-notes',JSON.stringify(notes))}catch(e){}}function render(){const item=TASKS[idx];$('session').textContent=item.time;$('phase').textContent=item.phase;$('title').textContent=item.title;$('say').textContent=item.say;$('screen').textContent=item.screen;$('practice').textContent=item.practice;$('check').textContent=item.check;$('note').value=notes[idx]||'';$('complete').textContent=done[idx]?'✓ تم الإنجاز':'✓ انجزت المهمة';$('prev').disabled=idx===0;$('next').disabled=idx===TASKS.length-1;menu.innerHTML='';TASKS.forEach((t,i)=>{const b=document.createElement('button');b.type='button';b.className='tab'+(idx===i?' on':'')+(done[i]?' done':'');const n=document.createElement('span');n.textContent=String(i+1).padStart(2,'0');b.appendChild(n);b.append(document.createTextNode(t.title));b.onclick=()=>{idx=i;render()};menu.appendChild(b)});const n=done.filter(Boolean).length;$('progressLabel').textContent=String(n).padStart(2,'0')+' / '+String(TASKS.length).padStart(2,'0');$('bar').style.width=(n/TASKS.length*100)+'%';save();}function go(delta){idx=Math.max(0,Math.min(TASKS.length-1,idx+delta));render()}$('complete').onclick=()=>{done[idx]=!done[idx];if(done[idx]&&idx<TASKS.length-1){idx++}render()};$('prev').onclick=()=>go(-1);$('next').onclick=()=>go(1);$('note').addEventListener('input',e=>{notes[idx]=e.target.value;save()});const reduced=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;let off=reduced;const motion=$('motion');function apply(){document.body.classList.toggle('reduced',off);motion.textContent=off?'تشغيل الحركة':'ايقاف الحركة'}motion.onclick=()=>{off=!off;apply()};apply();document.addEventListener('keydown',e=>{if(e.target.tagName==='TEXTAREA')return;if(e.key==='ArrowLeft')go(1);if(e.key==='ArrowRight')go(-1)});render()})();
</script></body></html>
