<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>لوحات اليوم السابع</title><style>@import url("https://fonts.googleapis.com/css2?family=Almarai:wght@300;400;700;800&family=Inter:wght@400;500;600;700;800&display=swap");*{box-sizing:border-box}body{margin:0;background:#f3f7f7;color:#13233b;font:16px/1.7 Almarai,"Segoe UI",sans-serif}main{max-width:1440px;margin:auto;padding:28px}header{padding:26px;background:#13233b;color:white;border-radius:18px}h1,h2,p{margin:0}header p{margin-top:10px;color:#d6e4e6}.en{direction:ltr;text-align:right;color:#61717c}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px;margin-top:24px}article{padding:20px;border-radius:16px;background:white;border:1px solid #dde7e8}.preview{display:block;width:100%;background:none;border:0;padding:0;margin:14px 0;cursor:zoom-in}img{display:block;width:100%;height:auto;border-radius:8px}nav{display:flex;gap:20px;flex-wrap:wrap}a{color:#087f7f;text-decoration:none}dialog{border:0;border-radius:14px;padding:14px;max-width:96vw;width:1600px}dialog::backdrop{background:#13233be0}dialog button{border:0;background:#099999;color:white;padding:10px 20px;border-radius:8px;font:inherit;margin-bottom:10px;cursor:pointer}@media(max-width:800px){.grid{grid-template-columns:1fr}main{padding:14px}h1{font-size:24px}}</style></head><body><main><header><h1>أربع لوحات، أربع قرارات</h1><p>تصاميم مرجعية لنتيجة اليوم السابع. اضغط على اللوحة لتكبيرها.</p></header><section class="grid"><article><h2>محمود</h2><p class="en">Sales</p><button class="preview" data-src="../images/mahmoud-sales.png" aria-label="تكبير لوحة محمود"><img src="../images/mahmoud-sales.png" alt="تصميم لوحة محمود"></button><nav><a href="MAHMOUD_SALES.html">الصيغ والمطلوب</a><a href="../images/mahmoud-sales.png" download>تنزيل الصورة</a></nav></article><article><h2>سمية</h2><p class="en">Operations</p><button class="preview" data-src="../images/somaya-operations.png" aria-label="تكبير لوحة سمية"><img src="../images/somaya-operations.png" alt="تصميم لوحة سمية"></button><nav><a href="SOMAYA_OPERATIONS.html">الصيغ والمطلوب</a><a href="../images/somaya-operations.png" download>تنزيل الصورة</a></nav></article><article><h2>هشام</h2><p class="en">Finance</p><button class="preview" data-src="../images/hisham-finance.png" aria-label="تكبير لوحة هشام"><img src="../images/hisham-finance.png" alt="تصميم لوحة هشام"></button><nav><a href="HISHAM_FINANCE.html">الصيغ والمطلوب</a><a href="../images/hisham-finance.png" download>تنزيل الصورة</a></nav></article><article><h2>إيناس</h2><p class="en">Workforce Planning</p><button class="preview" data-src="../images/enas-workforce.png" aria-label="تكبير لوحة إيناس"><img src="../images/enas-workforce.png" alt="تصميم لوحة إيناس"></button><nav><a href="ENAS_WORKFORCE.html">الصيغ والمطلوب</a><a href="../images/enas-workforce.png" download>تنزيل الصورة</a></nav></article></section><p style="margin-top:22px"><a href="index.html">دليل اليوم السابع</a></p></main><dialog id="zoom"><button id="close">إغلاق</button><img id="fullImage" alt="تصميم اللوحة المكبر"></dialog><script>const zoom=document.getElementById(`zoom`);const fullImage=document.getElementById(`fullImage`);document.querySelectorAll(`.preview`).forEach(button=>button.addEventListener(`click`,()=>{fullImage.src=button.dataset.src;zoom.showModal();}));document.getElementById(`close`).addEventListener(`click`,()=>zoom.close());zoom.addEventListener(`click`,event=>{if(event.target===zoom)zoom.close();});</script></body></html>
