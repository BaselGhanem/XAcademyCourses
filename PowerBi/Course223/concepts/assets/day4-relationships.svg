<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<rect width="1600" height="900" fill="#0b1116"/><rect x="60" y="55" width="1480" height="790" rx="36" fill="#121a21" stroke="#27343d"/>
<text x="110" y="125" fill="#099999" font-size="28" font-family="Arial" font-weight="700">DAY 4 • RELATIONSHIPS</text>
<text x="110" y="185" fill="#fff" font-size="58" font-family="Arial" font-weight="800">Auto Detect vs Manual Relationship</text>
<text x="110" y="230" fill="#9eb0bc" font-size="27" font-family="Arial">Power BI can suggest relationships • You still validate the business keys</text>
<rect x="120" y="300" width="650" height="330" rx="28" fill="#0d292b" stroke="#099999" stroke-width="3"/>
<text x="165" y="360" fill="#6edbd7" font-size="34" font-family="Arial" font-weight="800">AUTO DETECT • REVIEW</text>
<text x="165" y="415" fill="#fff" font-size="27" font-family="Arial" font-weight="700">DimProduct[Product ID]</text>
<text x="165" y="455" fill="#9eb0bc" font-size="23" font-family="Arial">→ FactSales[Product ID]</text>
<text x="165" y="515" fill="#fff" font-size="27" font-family="Arial" font-weight="700">DimBranch[Branch ID]</text>
<text x="165" y="555" fill="#9eb0bc" font-size="23" font-family="Arial">→ FactSales[Branch ID]</text>
<text x="165" y="605" fill="#f2c811" font-size="22" font-family="Arial" font-weight="700">Suggested does not mean automatically correct.</text>
<rect x="830" y="300" width="650" height="330" rx="28" fill="#211f12" stroke="#f2c811" stroke-width="3"/>
<text x="875" y="360" fill="#f2c811" font-size="34" font-family="Arial" font-weight="800">MANUAL • UNDERSTAND THE KEY</text>
<text x="875" y="415" fill="#fff" font-size="27" font-family="Arial" font-weight="700">DimCustomer[Customer Code]</text>
<text x="875" y="455" fill="#9eb0bc" font-size="23" font-family="Arial">→ FactSales[Customer ID]</text>
<text x="875" y="515" fill="#fff" font-size="27" font-family="Arial" font-weight="700">DimDate[Date]</text>
<text x="875" y="555" fill="#9eb0bc" font-size="23" font-family="Arial">→ FactSales[Order Date]</text>
<text x="875" y="605" fill="#6edbd7" font-size="22" font-family="Arial" font-weight="700">Different names can still represent the same key.</text>
<line x1="240" y1="700" x2="1360" y2="700" stroke="#54656f" stroke-width="4"/><circle cx="300" cy="700" r="28" fill="#099999"/><text x="300" y="711" text-anchor="middle" fill="#fff" font-size="25" font-family="Arial" font-weight="800">1</text><circle cx="1300" cy="700" r="28" fill="#f2c811"/><text x="1300" y="713" text-anchor="middle" fill="#111" font-size="29" font-family="Arial" font-weight="800">*</text>
<text x="800" y="755" text-anchor="middle" fill="#fff" font-size="28" font-family="Arial" font-weight="700">Check Key • Data Type • Cardinality • Filter Direction</text>
<text x="800" y="815" text-anchor="middle" fill="#9eb0bc" font-size="25" font-family="Arial">Auto Detect helps. The analyst decides.</text>
</svg>