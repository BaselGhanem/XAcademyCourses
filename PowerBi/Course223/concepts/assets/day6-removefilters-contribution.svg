<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<rect width="1600" height="900" fill="#0b1116"/><rect x="60" y="55" width="1480" height="790" rx="36" fill="#121a21" stroke="#27343d"/>
<text x="110" y="125" fill="#a98bff" font-size="28" font-family="Arial" font-weight="700">DAY 6 • REMOVEFILTERS + CONTRIBUTION</text>
<text x="110" y="185" fill="#fff" font-size="56" font-family="Arial" font-weight="800">Remove One Filter, Keep the Rest</text>
<text x="110" y="230" fill="#9eb0bc" font-size="27" font-family="Arial">Find each Category share inside the current Month / Region / Branch context.</text>
<rect x="140" y="320" width="420" height="230" rx="26" fill="#0d292b" stroke="#099999" stroke-width="3"/><text x="350" y="380" text-anchor="middle" fill="#6edbd7" font-size="29" font-family="Arial" font-weight="800">NUMERATOR</text><text x="350" y="440" text-anchor="middle" fill="#fff" font-size="34" font-family="Arial" font-weight="800">[Total Revenue]</text><text x="350" y="495" text-anchor="middle" fill="#9eb0bc" font-size="23" font-family="Arial">Current Category + all other filters</text>
<rect x="1040" y="320" width="420" height="230" rx="26" fill="#211f12" stroke="#f2c811" stroke-width="3"/><text x="1250" y="380" text-anchor="middle" fill="#f2c811" font-size="29" font-family="Arial" font-weight="800">DENOMINATOR</text><text x="1250" y="435" text-anchor="middle" fill="#fff" font-size="27" font-family="Arial" font-weight="800">Revenue All Categories</text><text x="1250" y="485" text-anchor="middle" fill="#9eb0bc" font-size="22" font-family="Arial">REMOVEFILTERS(Category)</text><text x="1250" y="520" text-anchor="middle" fill="#6edbd7" font-size="20" font-family="Arial">Month + Region stay active</text>
<path d="M560 435 L710 530" stroke="#71838d" stroke-width="6"/><path d="M1040 435 L890 530" stroke="#71838d" stroke-width="6"/>
<rect x="655" y="510" width="290" height="120" rx="26" fill="#271a2c" stroke="#a98bff" stroke-width="3"/><text x="800" y="555" text-anchor="middle" fill="#c9b7ff" font-size="28" font-family="Arial" font-weight="800">DIVIDE</text><text x="800" y="602" text-anchor="middle" fill="#fff" font-size="25" font-family="Arial">Contribution %</text>
<rect x="330" y="690" width="940" height="80" rx="20" fill="#10181e" stroke="#34434d"/><text x="800" y="738" text-anchor="middle" fill="#fff" font-size="26" font-family="Arial">Remove exactly the filter you need to ignore — not the whole report context.</text>
</svg>