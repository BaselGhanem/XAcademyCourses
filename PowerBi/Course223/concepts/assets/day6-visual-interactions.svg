<text x="110" y="185" fill="#fff" font-size="58" font-family="Arial" font-weight="800">A Click Can Change the Context</text>
<text x="110" y="230" fill="#9eb0bc" font-size="27" font-family="Arial">Edit interactions lets you decide what one visual does to another.</text>
