<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>مفاهيم الدورة حسب اليوم | X Academy</title>
  <link rel="stylesheet" href="../styles.css?v=course-20261015-general">
</head>
<body>
  <header class="topbar"><div class="shell topbar-inner">
    <a class="brand" href="../index.html"><span class="pbi-mark"><span></span><span></span><span></span></span><span class="brand-copy"><strong>Power BI | X Academy</strong><small>CONCEPT PLAN</small></span></a>
    <a class="btn btn-ghost" href="../dashboard.html">مركز الدورة</a>
  </div></header>
  <main class="shell section">
    <span class="eyebrow">CONCEPTS BY DAY</span>
    <h1 class="section-title">المفاهيم حسب اليوم</h1>
    <p class="section-copy">اليوم الاول تم تدريسه، وشرح اليوم الثاني لتنظيف تقييمات الاداء جاهز، باقي المفاهيم مخططة</p>
    <div class="filter-row" id="dayFilters" aria-label="اختيار اليوم"></div>
    <section class="panel" style="margin-top:24px">
      <h2 id="dayTitle"></h2><p id="dayMission" class="section-copy"></p>
      <div class="topic-grid" id="conceptList"></div>
      <a class="btn btn-teal" id="dayLink" style="margin-top:24px">المحتوى والتمرين والملفات المطلوبة</a>
    </section>
  </main>
  <script src="../data.js?v=20261017-learner-csv"></script>
  <script>
    const requestedDay = Number(new URLSearchParams(location.search).get(`day`));
    let activeDay = getDay(requestedDay) ? requestedDay : 1;
    function render() {
      const day = getDay(activeDay);
      document.getElementById(`dayTitle`).textContent = `اليوم ${day.id} — ${day.titleAr}`;
      document.getElementById(`dayMission`).textContent = day.mission;
      document.getElementById(`dayLink`).href = day.id === 1 ? `../week1/day1/web/Day01_Guide.html` : `../day.html?id=${day.id}`;
      document.getElementById(`conceptList`).replaceChildren();
      day.topics.forEach(topic => {
        const item = document.createElement(`div`);
        item.className = `topic-item`;
        item.dir = `ltr`;
        item.textContent = topic;
        document.getElementById(`conceptList`).appendChild(item);
      });
      document.querySelectorAll(`[data-day]`).forEach(button => {
        const selected = Number(button.dataset.day) === activeDay;
        button.classList.toggle(`active`, selected);
        button.setAttribute(`aria-pressed`, String(selected));
      });
    }
    DAYS.forEach(day => {
      const button = document.createElement(`button`);
      button.className = `filter-btn`;
      button.dataset.day = day.id;
      button.textContent = `اليوم ${day.id}`;
      button.addEventListener(`click`, () => {
        activeDay = day.id;
        history.replaceState(null, ``, `?day=${day.id}`);
        render();
      });
      document.getElementById(`dayFilters`).appendChild(button);
    });
    render();
  </script>
</body>
</html>
